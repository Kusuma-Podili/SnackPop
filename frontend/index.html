<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SnackPop Saga - Candy Crush Food Matching Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Ambient Particle & Juice Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- App Wrapper -->
  <div id="snackpop-app-root">
    <!-- Bottom Floating Navigation Menu Bar -->
    <nav class="bottom-nav-bar">
      <button class="nav-item-btn" id="nav-btn-spin">
        <span class="nav-icon">🎡</span>
        <span class="nav-label">Daily Spin</span>
      </button>
      <button class="nav-item-btn" id="nav-btn-cookbook">
        <span class="nav-icon">📖</span>
        <span class="nav-label">Cookbook</span>
      </button>
      <button class="nav-item-btn" id="nav-btn-achievements">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">Trophies</span>
      </button>
      <button class="nav-item-btn" id="nav-btn-music">
        <span class="nav-icon">🎵</span>
        <span class="nav-label">Music: OFF</span>
      </button>
      <button class="nav-item-btn" id="nav-btn-settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>

    <!-- Main Viewport Arena -->
    <main id="app-main"></main>

    <!-- Modals & Overlays Container -->
    <div id="app-modals"></div>
  </div>

  <!-- Runtime Application Bundle / Modules -->
  <script type="module" src="./js/bundle.js"></script>
</body>
</html>
