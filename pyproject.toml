[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snackpop-saga"
version = "1.0.0"
description = "SnackPop Match-3 Saga Production Backend and Game Engine"
readme = "README.md"
authors = [{ name = "Kusuma Podili", email = "podilikusuma15@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]

[project.scripts]
snackpop = "run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
